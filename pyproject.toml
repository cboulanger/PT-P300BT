[project]
name = "pt-p300bt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.65.0",
    "packbits>=0.6",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pyobjc-framework-iobluetooth>=12.2.2 ; sys_platform == 'darwin'",
    "pyserial>=3.5",
    "uharfbuzz>=0.56.1",
]

[project.scripts]
print = "printcmd:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "printcmd",
    "printlabel",
    "labelmaker",
    "labelmaker_encode",
    "fontbrowser",
    "ptcbp",
    "ptgui",
    "ptstatus",
]
